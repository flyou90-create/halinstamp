<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할인스탬프 — 오늘도 확인한 할인코드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --color-bg: #E7F1FB;
    --color-sea-deep: #1B6FA8;
    --color-sea-mid: #4E9DD6;
    --color-sun: #FFC857;
    --color-surface: #FFFFFF;
    --color-ink: #1B2340;
    --color-ink-soft: #545B75;
    --color-ink-faint: #9298AC;
    --color-stamp: #C0392B;
    --color-stamp-soft: #FBEAE7;
    --color-line: #E4E4E2;
    --color-travel: #2C6E8C;   --color-travel-soft: #E2EEF2;
    --color-commerce: #B8752F; --color-commerce-soft: #F5E9D9;
    --color-card: #6B5B95;     --color-card-soft: #ECE8F5;
    --color-guide: #3F8863;    --color-guide-soft: #E3F0E9;
    --font-body: 'Pretendard', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  header.site { position: relative; overflow: hidden; }
  .ocean-hero-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden; z-index: 0; pointer-events: none;
  }
  .ocean-hero-bg svg { width: 100%; height: 100%; display: block; }
  .logo, .tagline { position: relative; z-index: 1; }

  header.site { max-width: 1080px; margin: 0 auto; padding: 40px 24px 34px; min-height: 150px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; letter-spacing: -0.02em; cursor: pointer; text-shadow: 0 1px 6px rgba(255,255,255,0.9), 0 0px 2px rgba(255,255,255,0.9); }
  .logo .badge { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; background: var(--color-stamp); color: #fff; font-family: var(--font-mono); font-size: 13px; font-weight: 700; transform: rotate(-6deg); }
  .tagline { font-size: 13px; color: var(--color-ink-faint); font-weight: 500; text-shadow: 0 1px 6px rgba(255,255,255,0.9), 0 0px 2px rgba(255,255,255,0.9); }

  .cat-toggle { max-width: 1080px; margin: 6px auto 10px; padding: 0 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .cat-btn { font-family: var(--font-body); font-weight: 700; font-size: 14px; padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--color-line); background: var(--color-surface); color: var(--color-ink-faint); cursor: pointer; transition: all .2s ease; }
  .cat-btn.active[data-cat="home"]     { background: var(--color-ink);      border-color: var(--color-ink);      color: #fff; }
  .cat-btn.active[data-cat="travel"]   { background: var(--color-travel);   border-color: var(--color-travel);   color: #fff; }
  .cat-btn.active[data-cat="commerce"] { background: var(--color-commerce); border-color: var(--color-commerce); color: #fff; }
  .cat-btn.active[data-cat="card"]     { background: var(--color-card);     border-color: var(--color-card);     color: #fff; }
  .cat-btn.active[data-cat="guide"]    { background: var(--color-guide);    border-color: var(--color-guide);    color: #fff; }

  .view-toggle { max-width: 1080px; margin: 16px auto 22px; padding: 0 24px; display: flex; gap: 4px; border-bottom: 1.5px solid var(--color-line); min-height: 20px; }
  .view-btn { font-family: var(--font-body); font-weight: 600; font-size: 13.5px; padding: 9px 4px; margin-right: 20px; border: none; background: none; cursor: pointer; color: var(--color-ink-faint); border-bottom: 2.5px solid transparent; margin-bottom: -1.5px; }
  .view-btn.active { color: var(--color-ink); border-bottom-color: currentColor; }

  main { max-width: 1080px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---------- Home ---------- */
  .home-hero { padding: 8px 0 28px; }
  .home-hero h1 { font-size: clamp(24px, 3.6vw, 32px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.35; max-width: 600px; text-shadow: 0 1px 10px rgba(255,255,255,0.85), 0 1px 3px rgba(255,255,255,0.9); }
  .home-hero p { margin-top: 10px; font-size: 14px; color: var(--color-ink-soft); max-width: 480px; text-shadow: 0 1px 8px rgba(255,255,255,0.9), 0 1px 2px rgba(255,255,255,0.9); }

  .home-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 36px; align-items: stretch; }
  @media (max-width: 720px) { .home-tiles { grid-template-columns: repeat(2, 1fr); } }
  .home-tile { border-radius: 16px; padding: 22px 18px; cursor: pointer; border: none; text-align: left; transition: transform .15s ease; }
  .home-tile:hover { transform: translateY(-2px); }
  .home-tile .tile-icon { font-size: 26px; margin-bottom: 10px; display: block; }
  .home-tile .tile-name { font-weight: 800; font-size: 15px; margin-bottom: 3px; display: block; }
  .home-tile .tile-count { font-size: 12px; opacity: .85; display: block; }
  .home-tile[data-cat="travel"]   { background: var(--color-travel-soft);   color: var(--color-travel);   border: 1.5px solid var(--color-travel);   box-shadow: 0 3px 10px -5px rgba(44,110,140,0.35); }
  .home-tile[data-cat="commerce"] { background: var(--color-commerce-soft); color: var(--color-commerce); border: 1.5px solid var(--color-commerce); box-shadow: 0 3px 10px -5px rgba(184,117,47,0.35); }
  .home-tile[data-cat="card"]     { background: var(--color-card-soft);     color: var(--color-card);     border: 1.5px solid var(--color-card);     box-shadow: 0 3px 10px -5px rgba(107,91,149,0.35); }
  .home-tile[data-cat="guide"]    { background: var(--color-guide-soft);    color: var(--color-guide);    border: 1.5px solid var(--color-guide);    box-shadow: 0 3px 10px -5px rgba(63,136,99,0.35); }

  .home-section-title { font-size: 13px; font-weight: 700; color: var(--color-ink-faint); letter-spacing: 0.03em; margin-bottom: 12px; }

  /* ---------- Brand grid ---------- */
  .brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; align-items: stretch; }
  .brand-card { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: 14px; padding: 12px 16px; cursor: pointer; text-align: left; transition: transform .15s ease, box-shadow .15s ease; display: flex; align-items: center; justify-content: center; gap: 20px; }
  .brand-card:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -10px rgba(27,35,64,0.18); }
  .brand-card .brand-logo-box { width: 68px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .brand-card .brand-logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .brand-card .brand-logo-box .emoji-fallback { font-size: 36px; line-height: 1; }
  .brand-card .brand-info { min-width: 0; }
  .brand-card .brand-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .brand-card .brand-count { font-size: 11.5px; color: var(--color-ink-faint); }
  .brand-card .brand-best { font-size: 11.5px; font-weight: 700; margin-top: 6px; padding: 2px 8px; border-radius: 5px; display: inline-block; }
  .brand-card[data-cat="travel"] .brand-best   { background: var(--color-travel-soft);   color: var(--color-travel); }
  .brand-card[data-cat="commerce"] .brand-best { background: var(--color-commerce-soft); color: var(--color-commerce); }

  /* ---------- Back / breadcrumb ---------- */
  .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .home-nav-row { max-width: 1080px; margin: 0 auto 4px; padding: 0 24px; }
  .back-btn { font-family: var(--font-body); font-size: 13px; font-weight: 700; color: var(--color-ink-soft); background: var(--color-surface); border: 1.5px solid var(--color-line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .back-btn:hover { color: var(--color-ink); }
  .brand-detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .brand-detail-header .brand-icon-lg { font-size: 26px; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 12px; background: var(--color-surface); border: 1px solid var(--color-line); flex-shrink: 0; }
  .brand-detail-header .brand-icon-lg img { max-width: 76%; max-height: 60%; object-fit: contain; }
  .brand-detail-header h2 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }

  /* ---------- Ticket card ---------- */
  .ticket-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 720px) { .ticket-grid { grid-template-columns: 1fr; } }
  .ticket { background: var(--color-surface); border-radius: 14px; border: 1px solid var(--color-line); display: flex; position: relative; overflow: hidden; }
  .ticket-main { flex: 1; padding: 18px 16px; }
  .ticket-stub { width: 92px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 2px dashed var(--color-line); padding: 12px 8px; text-align: center; }
  .ticket-stub .stub-label { font-size: 10px; color: var(--color-ink-faint); font-weight: 700; margin-bottom: 4px; }
  .ticket-stub .stub-btn { font-family: var(--font-body); font-size: 12px; font-weight: 700; color: #fff; border: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; line-height: 1.3; }
  .ticket[data-cat="travel"] .stub-btn { background: var(--color-travel); }
  .ticket[data-cat="commerce"] .stub-btn { background: var(--color-commerce); }
  .ticket-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .platform-tag { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px; }
  .ticket[data-cat="travel"] .platform-tag { background: var(--color-travel-soft); color: var(--color-travel); }
  .ticket[data-cat="commerce"] .platform-tag { background: var(--color-commerce-soft); color: var(--color-commerce); }
  .stamp { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--color-stamp); border: 1.5px solid var(--color-stamp); border-radius: 5px; padding: 2px 7px; transform: rotate(-5deg); white-space: nowrap; }
  .code-row { font-family: var(--font-mono); font-size: 18px; font-weight: 700; background: var(--color-bg); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; display: inline-block; }
  .ticket-desc { font-size: 13px; color: var(--color-ink-soft); line-height: 1.5; }

  .card-list { display: flex; flex-direction: column; gap: 14px; }
  .hotdeal-section { margin-bottom: 30px; }
  .hotdeal-section-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; padding-left: 10px; border-left: 4px solid var(--color-commerce); }
  .hotdeal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .hotdeal-card { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; display: block; transition: transform .15s ease, box-shadow .15s ease; }
  .hotdeal-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(27,35,64,0.2); }
  .hotdeal-img { width: 100%; aspect-ratio: 1/1; background: var(--color-bg); display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .hotdeal-img img { width: 100%; height: 100%; object-fit: cover; }
  .hotdeal-info { padding: 12px; }
  .hotdeal-merchant { font-size: 10.5px; font-weight: 700; color: var(--color-commerce); margin-bottom: 3px; }
  .hotdeal-name { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
  .hotdeal-price-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .hotdeal-discount { font-size: 13px; font-weight: 800; color: var(--color-stamp); }
  .hotdeal-sale { font-size: 14px; font-weight: 800; }
  .hotdeal-orig { font-size: 11px; color: var(--color-ink-faint); text-decoration: line-through; }
  .item-card { background: var(--color-surface); border-radius: 14px; border: 1px solid var(--color-line); padding: 18px 20px; display: flex; align-items: center; gap: 16px; }
  .item-thumb { width: 60px; height: 60px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .item-card[data-cat="travel"]   .item-thumb { background: var(--color-travel-soft); }
  .item-card[data-cat="commerce"] .item-thumb { background: var(--color-commerce-soft); }
  .item-card[data-cat="card"]     .item-thumb { background: var(--color-card-soft); }
  .item-card[data-cat="guide"]    .item-thumb { background: var(--color-guide-soft); }
  .item-card[data-cat="card"] { align-items: flex-start; padding: 22px; gap: 22px; }
  .item-card[data-cat="card"] .item-thumb { width: 148px; height: 148px; background: #fff; border: 1px solid var(--color-line); box-shadow: 0 8px 20px -10px rgba(27,35,64,0.25); padding: 10px; }
  .item-card[data-cat="card"] .item-title { font-size: 17px; margin-top: 2px; }
  .item-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .item-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px; }
  .item-card[data-cat="travel"]   .item-tag { background: var(--color-travel-soft);   color: var(--color-travel); }
  .item-card[data-cat="commerce"] .item-tag { background: var(--color-commerce-soft); color: var(--color-commerce); }
  .item-card[data-cat="card"]     .item-tag { background: var(--color-card-soft);     color: var(--color-card); }
  .item-card[data-cat="guide"]    .item-tag { background: var(--color-guide-soft);    color: var(--color-guide); }
  .item-date { font-size: 11.5px; color: var(--color-ink-faint); }
  .item-title { font-size: 15px; font-weight: 700; margin-bottom: 3px; letter-spacing: -0.01em; }
  .item-excerpt { font-size: 13px; color: var(--color-ink-soft); }
  .item-card[data-cat="card"] .item-meta { margin-bottom: 6px; }
  .item-card[data-cat="card"] .item-excerpt { line-height: 1.55; }

  .tag-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .tag-chip { font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--color-line); background: var(--color-surface); color: var(--color-ink-soft); cursor: pointer; }
  .tag-chip.active { background: var(--color-card); border-color: var(--color-card); color: #fff; }

  .empty-note { font-size: 13px; color: var(--color-ink-faint); text-align: center; padding: 40px 0; border: 1.5px dashed var(--color-line); border-radius: 12px; }
  footer { max-width: 1080px; margin: 0 auto; padding: 0 24px 48px; font-size: 12px; color: var(--color-ink-faint); border-top: 1px solid var(--color-line); padding-top: 20px; }
</style>
</head>
<body>

<header class="site">
  <div class="ocean-hero-bg">

  </div>
  <div class="logo" id="logoHome"><span class="badge">✓</span>할인스탬프</div>
  <div class="tagline">매달 확인하고 도장 찍은, 진짜 할인코드만</div>
</header>

<div class="cat-toggle" id="catToggle">
  <button class="cat-btn active" data-cat="home">🏠 홈</button>
  <button class="cat-btn" data-cat="travel">✈️ 여행 할인</button>
  <button class="cat-btn" data-cat="commerce">🛍 쇼핑 할인</button>
  <button class="cat-btn" data-cat="card">💳 카드 혜택</button>
  <button class="cat-btn" data-cat="guide">💡 꿀팁가이드</button>
</div>

<div class="view-toggle" id="viewToggle"></div>
<div class="home-nav-row" id="homeNav" style="display:none;">
  <button class="back-btn" id="homeNavBtn">← 이전 페이지</button>
</div>
<main id="main"></main>

<footer>
  할인스탬프 프로토타입 · 예시/실제 프로모션 데이터 혼합입니다 · 일부 링크는 제휴 링크이며 구매/예약 시 수수료를 받을 수 있습니다
</footer>

// data/hotdeal.json은 GitHub Actions가 매일 자동 갱신함
async function loadHotdeal() {
  try {
    const res = await fetch('./data/hotdeal.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch failed');
    const json = await res.json();
    if (Array.isArray(json) && json.length) {
      data.commerce.hotdeal = json;
    }
  } catch (e) {
    hotdealLoadFailed = true;
  }
  // 지금 핫딜 화면을 보고 있으면 다시 그려줌
  if (currentCat === 'commerce' && currentView === 'hotdeal') renderMain();
}
loadHotdeal();

async function loadBestProducts() {
  try {

let currentView = null;

let selectedIssuer = null;

let hotdealCatFilter = null;
let navStarted = false; // whether we've moved away from the very first home state

function snapshotState() {
  return { currentCat, currentView, selectedBrand, selectedIssuer, cardTagFilter };
}
function applySnapshot(s) {
  currentCat = s.currentCat;
  currentView = s.currentView;
  selectedBrand = s.selectedBrand;
  selectedIssuer = s.selectedIssuer;
  cardTagFilter = s.cardTagFilter;
}
function syncChromeAndRender() {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === currentCat));
  document.getElementById('homeNav').style.display = (currentCat === 'home' && !selectedBrand && !selectedIssuer) ? 'none' : 'block';
  renderViewToggle(true);
  renderMain();
  window.scrollTo({top:0, behavior:'smooth'});
}
// pushHistory: call AFTER mutating state, to record the new state as a fresh browser history entry
function pushHistory() {
  navStarted = true;
  history.pushState(snapshotState(), '');
}
// goBack: hand off to the real browser back button (mouse back button works the same way)
function goBack() {
  history.back();
}
window.addEventListener('popstate', (e) => {
  if (e.state) {
    applySnapshot(e.state);
    syncChromeAndRender();
  }
});
history.replaceState(snapshotState(), '');

function iconFor(platform) {
  const map = { '하나카드':'💳','신한카드':'💳','삼성카드':'💳','현대카드':'💳' };
  return map[platform] || '🎫';
}

function bestBadge(brand) {
  if (!brand.codes.length) return '코드 준비중';
  const d = brand.codes[0].desc;
  const m = d.match(/(\d+%|\$\d[,\d.]*|\d[,\d]*(?:천|만)?원)(?=\s*(?:즉시)?\s*할인)/);
  return m ? '최대 ' + m[0] + ' 할인' : '혜택 보기';
}

function renderViewToggle(keepCurrent) {
  const wrap = document.getElementById('viewToggle');
  const views = catConfig[currentCat].views;
  if (!views.length) { wrap.innerHTML = ''; wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  const activeKey = keepCurrent && currentView ? currentView : views[0].key;
  wrap.innerHTML = views.map(v => `<button class="view-btn ${v.key===activeKey?'active':''}" data-view="${v.key}">${v.label}</button>`).join('');
  wrap.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.view === currentView) return;
      currentView = btn.dataset.view;
      selectedBrand = null;
      selectedIssuer = null;
      document.getElementById('homeNav').style.display = 'block';
      wrap.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b === btn));
      pushHistory();
      renderMain();
    });
  });
  currentView = activeKey;
}

          <div class="hotdeal-info">
            <div class="hotdeal-merchant">${p.merchant_id || ''}</div>
            <div class="hotdeal-name">${p.title}</div>
            <div class="hotdeal-price-row">
              ${p.discount_rate ? `<span class="hotdeal-discount">${Math.round(p.discount_rate)}%</span>` : ''}
              <span class="hotdeal-sale">${p.sale_price ? Number(p.sale_price).toLocaleString() + '원' : '-'}</span>
              ${p.price && p.sale_price && p.price !== p.sale_price ? `<span class="hotdeal-orig">${Number(p.price).toLocaleString()}원</span>` : ''}
            </div>
          </div>
        </a>`;
      main.innerHTML = `
        <div style="background:var(--color-commerce-soft);border-radius:12px;padding:14px 16px;margin-bottom:22px;font-size:12.5px;color:var(--color-ink-soft);line-height:1.6;">
          💡 링크프라이스 "잘팔리는 상품" API 기준이에요 (지마켓 한정 아님). 판매수 높은 순으로 정렬했어요.
        </div>
        <div class="hotdeal-grid">${sorted.map(renderCard).join('')}</div>
      `;
    }
  } else if (currentCat === 'card') {
    if (currentView === 'credit' || currentView === 'check') {
      const wantType = currentView === 'credit' ? '신용카드' : '체크카드';
      if (selectedIssuer) {
        const issuer = data.card.issuers.find(i => i.name === selectedIssuer);
        const filteredCards = issuer.cards.filter(c => (c.type || '신용카드') === wantType);
        main.innerHTML = `
          <div class="brand-detail-header"><span class="brand-icon-lg">${issuer.logo ? `<img src="${issuer.logo}" alt="${issuer.name}">` : issuer.icon}</span><h2>${issuer.name} · ${wantType}</h2></div>
          <div style="background:var(--color-card-soft);border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:12.5px;color:var(--color-ink-soft);line-height:1.9;">
            💡 <strong>대부분의 카드에 공통으로 적용되는 전월실적 제외 항목</strong>이 있어요!<br>
            국세·지방세·관세 등 공과금, 전기·도시가스요금·아파트관리비, 초중고교 납입금·대학등록금, 4대보험료<br>
            고속도로 통행료·하이패스, 상품권 구매, 단기/장기카드대출(현금서비스·카드론), 연회비·이자<br>
            카드별 세부 제외 항목은 각 상품설명서를 확인하세요.
          </div>
          ${filteredCards.length ? `<div class="card-list">${filteredCards.map(c => `
            <div class="item-card" data-cat="card">
              <div class="item-thumb" style="${c.img ? 'background:var(--color-bg);padding:4px;' : 'background:var(--color-card-soft);font-size:56px;'}">${c.img ? `<img src="${c.img}" alt="${c.name}" style="width:100%;height:100%;object-fit:contain;">` : issuer.icon}</div>
              <div style="flex:1;min-width:0;">
                <div class="item-meta"><span class="item-tag" style="background:var(--color-ink);color:#fff;">${c.type || '신용카드'}</span>${c.tags.map(t => `<span class="item-tag">${t}</span>`).join('')}</div>
                <div class="item-title">${c.name}</div>
                <div class="item-excerpt">${c.desc}</div>
                ${c.benefits ? `<ul style="margin:10px 0 0; padding-left:18px; font-size:12.5px; color:var(--color-ink-soft); line-height:1.7;">${c.benefits.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}
                <div class="item-excerpt" style="margin-top:8px;color:var(--color-ink-faint);font-size:12px;">연회비 ${c.fee || '카드사 확인 필요'} · 실적조건 ${c.requirement || '카드사 확인 필요'}${c.brand ? ` · 국제브랜드 ${c.brand}` : ''}</div>
                ${c.link ? `<a href="${c.link}" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--color-card);text-decoration:none;border-bottom:1.5px solid var(--color-card);">${c.linkLabel || '자세히 보기'} →</a>` : ''}</div>

            </div>`).join('')}</div>` : `<div class="empty-note">이 카드사의 ${wantType}는 아직 정리된 게 없어요. 곧 업데이트할게요!</div>`}
        `;
      } else {
        const issuersWithType = data.card.issuers.filter(iss => iss.cards.some(c => (c.type || '신용카드') === wantType));
        main.innerHTML = issuersWithType.length ? `<div class="brand-grid" id="cardIssuerGrid"></div>` : `<div class="empty-note">아직 ${wantType}가 등록된 카드사가 없어요.</div>`;
        if (issuersWithType.length) {
          const grid = document.getElementById('cardIssuerGrid');
          grid.innerHTML = issuersWithType.map(iss => {
            const cnt = iss.cards.filter(c => (c.type || '신용카드') === wantType).length;
            return `
            <button class="brand-card" data-cat="card" data-issuer="${iss.name}">
              <div class="brand-logo-box">${iss.logo ? `<img src="${iss.logo}" alt="${iss.name}">` : `<span class="emoji-fallback">${iss.icon}</span>`}</div>
              <div class="brand-info">
                <div class="brand-name">${iss.name}</div>
                <div class="brand-count">${cnt}개 카드</div>
              </div>
            </button>
          `;
          }).join('');
          grid.querySelectorAll('.brand-card').forEach(card => {
            card.addEventListener('click', () => { selectedIssuer = card.dataset.issuer; document.getElementById('homeNav').style.display = 'block'; pushHistory(); renderMain(); });
          });
        }
      }
    } else {
      // bytag: flatten all cards across issuers
      let flat = data.card.issuers.flatMap(iss => iss.cards.map(c => ({...c, issuer: iss.name, icon: iss.icon})));
      const allTags = [...new Set(flat.flatMap(c => c.tags))];
      const filterHtml = `<div class="tag-filter">${allTags.map(t => `<button class="tag-chip ${cardTagFilter===t?'active':''}" data-tag="${t}">${t}</button>`).join('')}</div>`;
      if (cardTagFilter) flat = flat.filter(c => c.tags.includes(cardTagFilter));
      main.innerHTML = filterHtml + `<div class="card-list">${flat.map(c => `
        <div class="item-card" data-cat="card">
          <div class="item-thumb" style="${c.img ? 'background:var(--color-bg);padding:4px;' : 'background:var(--color-card-soft);font-size:56px;'}">${c.img ? `<img src="${c.img}" alt="${c.name}" style="width:100%;height:100%;object-fit:contain;">` : c.icon}</div>
          <div style="flex:1;min-width:0;">
            <div class="item-meta">${c.type ? `<span class="item-tag" style="background:var(--color-ink);color:#fff;">${c.type}</span>` : ''}${c.tags.map(t => `<span class="item-tag">${t}</span>`).join('')}</div>
            <div class="item-title">${c.name} <span style="font-weight:500;color:var(--color-ink-faint);font-size:12px;">· ${c.issuer}</span></div>
            <div class="item-excerpt">${c.desc}</div>
            ${c.link ? `<a href="${c.link}" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--color-card);text-decoration:none;border-bottom:1.5px solid var(--color-card);">${c.linkLabel || '자세히 보기'} →</a>` : ''}
          </div>
        </div>`).join('')}</div>`;
      main.querySelectorAll('.tag-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          cardTagFilter = cardTagFilter === chip.dataset.tag ? null : chip.dataset.tag;
          renderMain();
        });
      });
    }
  } else if (currentCat === 'guide') {
    const items = data.guide.list;
    main.innerHTML = `<div class="card-list">${items.map(item => `
      <div class="item-card" data-cat="guide">
        <div class="item-thumb">💡</div>
        <div>
          <div class="item-meta"><span class="item-tag">${item.tag}</span><span class="item-date">${item.date}</span></div>
          <div class="item-title">${item.title}</div>
          <div class="item-excerpt">${item.excerpt}</div>
        </div>
      </div>`).join('')}</div>`;
  }
}

function renderBrandGrid(cat, brands, container) {
  container.innerHTML = brands.map(b => `
    <button class="brand-card" data-cat="${cat}" data-platform="${b.platform}">
      <div class="brand-logo-box">${b.img ? `<img src="${b.img}" alt="${b.platform}">` : `<span class="emoji-fallback">${b.icon}</span>`}</div>
      <div class="brand-info">
        <div class="brand-name">${b.platform}</div>
        <div class="brand-count">${b.codes.length ? b.codes.length + '개 코드' : '코드 준비중'}</div>
        <span class="brand-best">${bestBadge(b)}</span>
      </div>
    </button>
  `).join('');
  container.querySelectorAll('.brand-card').forEach(card => {
    card.addEventListener('click', () => {
      selectCat(card.dataset.cat, { cat: card.dataset.cat, platform: card.dataset.platform });
      currentView = 'brands';
    });
  });
}

function selectCat(cat, brand) {
  currentCat = cat;
  selectedBrand = brand || null;
  selectedIssuer = null;
  cardTagFilter = null;
  hotdealCatFilter = null;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  document.getElementById('homeNav').style.display = cat === 'home' && !brand ? 'none' : 'block';
  renderViewToggle();
  if (brand) currentView = 'brands';
  pushHistory();
  renderMain();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('homeNavBtn').addEventListener('click', goBack);

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => selectCat(btn.dataset.cat));
});
document.getElementById('logoHome').addEventListener('click', () => selectCat('home'));

renderViewToggle();
renderMain();
</script>

</body>
</html>
