name: 핫딜 상품 데이터 자동 갱신

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 링크프라이스 지마켓 TOP100 상품 API 호출
        run: |
          curl -sSL "https://ep.linkprice.com/top100-products/merchant/gmarket/affiliate/${{ secrets.LINKPRICE_AFFILIATE_ID }}" \
            -o data/top100.json

      - name: 링크프라이스 지마켓 베스트상품 API 호출
        run: |
          curl -sSL "https://ep.linkprice.com/best-products/merchant/gmarket/affiliate/${{ secrets.LINKPRICE_AFFILIATE_ID }}" \
            -o data/best_gmarket.json

      - name: 지마켓 두 API 결과를 중복 제거해서 hotdeal.json으로 합치기
        run: |
          python3 << 'EOF'
          import json

          def load_list(path):
              try:
                  with open(path) as f:
                      d = json.load(f)
                  return d if isinstance(d, list) else []
              except Exception:
                  return []

          top100 = load_list('data/top100.json')
          best = load_list('data/best_gmarket.json')

          merged = {}
          for item in top100 + best:
              code = item.get('product_code')
              if code:
                  merged[code] = item

          result = list(merged.values())

          if not result:
              print("지마켓 API 모두 유효한 데이터가 없어 hotdeal.json 갱신을 건너뜁니다.")
          else:
              with open('data/hotdeal.json', 'w', encoding='utf-8') as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)
              print(f"hotdeal.json: 총 {len(result)}개 상품 (top100:{len(top100)}, best:{len(best)})")
          EOF
          rm -f data/top100.json data/best_gmarket.json

      - name: 링크프라이스 잘팔리는 상품(popularProducts) API 호출 - 베스트 상품용
        run: |
          curl -sSL -X POST \
            -d "discount=Y&page=1&per_page=50" \
            "https://api.linkprice.com/popularProducts/affiliateId/${{ secrets.LINKPRICE_AFFILIATE_ID }}" \
            -o data/popular_raw.json

      - name: 응답에서 상품 목록(list)만 추출해 bestproducts.json으로 저장
        run: |
          python3 << 'EOF'
          import json

          try:
              with open('data/popular_raw.json') as f:
                  d = json.load(f)
              items = d.get('list', []) if isinstance(d, dict) else (d if isinstance(d, list) else [])
          except Exception as e:
              print(f"파싱 실패: {e}")
              items = []

          if not items:
              print("잘팔리는 상품 API 응답이 비어있어 bestproducts.json 갱신을 건너뜁니다.")
          else:
              with open('data/bestproducts.json', 'w', encoding='utf-8') as f:
                  json.dump(items, f, ensure_ascii=False, indent=2)
              print(f"bestproducts.json: 총 {len(items)}개 상품")
          EOF
          rm -f data/popular_raw.json

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "hotdeal-bot"
          git config user.email "actions@github.com"
          git add data/hotdeal.json data/bestproducts.json
          git diff --cached --quiet || git commit -m "핫딜/베스트 상품 데이터 자동 갱신 $(date +'%Y-%m-%d')"
          git push
